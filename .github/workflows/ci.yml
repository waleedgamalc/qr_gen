name: CI/CD Pipeline


on:
  push:
    branches: "master"
  pull_request:
    branches: "master"

jobs:

  # 1st Job (testing the project)

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py -v

  # 2nd Job (pushing qr app image into docker hub)

  build-and-push:
    runs-on: ubuntu-latest
    needs: test              
    if: github.event_name == 'push'   

    steps:
      - name: Check out the repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .           
          push: true        
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qr-code-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/qr-code-app:${{ github.sha }}

  # 3rd Job (Deploying app on EC2 instance)

  Deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH to the instance to run the app image via docker hub
        uses: appleboy/ssh-action@v1.0.3
        with: 
        
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker stop qr-app || true
            docker rm qr-app || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/qr-code-app

            docker run -d \
              --name qr-app \
              --restart unless-stopped \
              -p 50:5000 \
              ${{ secrets.DOCKER_USERNAME }}/qr-code-app